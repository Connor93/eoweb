# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Build & Test

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec biome ci .
      - run: pnpm knip
      # Registry sanity only — self-contained, no DOM and no sibling repo.
      # The cross-repo `vfx:parity` guard deliberately does NOT run here:
      # it diffs against an aio-editor checkout that CI does not have. That
      # one is wired into lefthook pre-commit instead (see lefthook.yml).
      - run: pnpm vfx:check
    # - run: pnpm test
