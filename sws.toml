# static-web-server config for the eoweb client image.
# Config-file options take precedence over the base image's SERVER_* env vars.

[general]
host = "::"
port = 80
root = "/home/sws/public"

# Serve pre-compressed siblings (e.g. gfx021.egf.br) with Content-Encoding when
# the client sends Accept-Encoding. The browser's fetch() decompresses
# transparently, so the GFX loader needs no changes. (On-the-fly `compression`
# is intentionally left off — we ship pre-compressed files instead.)
compression-static = true

[advanced]

# The entry point must never be cached. index.html names the content-hashed
# JS/CSS bundles, so a stale copy pins the browser to an old build — and since
# those bundles are served with a one-year max-age, the old code keeps being
# served from cache too. SWS's default for text/html is max-age=86400, which
# meant every deploy took up to a day to reach returning players.
[[advanced.headers]]
source = "/"
[advanced.headers.headers]
Cache-Control = "no-cache"

[[advanced.headers]]
source = "/index.html"
[advanced.headers.headers]
Cache-Control = "no-cache"

# Runtime client config (WS host, title). Mounted at deploy time and not
# content-hashed, so it has to revalidate or a host change can't propagate.
[[advanced.headers]]
source = "/config.json"
[advanced.headers.headers]
Cache-Control = "no-cache"

# Cache the GFX for a day. Filenames are stable, so same-day/repeat loads come
# straight from the browser cache. The contents are NOT immutable, though — a
# merged-in graphic pack changes existing .egf files in place — so the loader
# appends a per-build `?v=` cache key (see gfx-loader.ts fetchEGF). Without it a
# changed .egf stays invisible for up to a day, and not even a hard reload
# clears it, because the fetch comes from a worker after navigation.
[[advanced.headers]]
source = "/gfx/**"
[advanced.headers.headers]
Cache-Control = "public, max-age=86400"
